<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factuality annotation</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --line:#d9d6cf; --accent:#2f5d8a; --warn:#9a3b2e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171716; --fg:#ecebe6; --muted:#a3a19a; --line:#3a3936; --accent:#8db4dc; --warn:#e08a7c; } }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin:0 0 8px; } h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 4px; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line); padding:10px; margin:0; background:transparent; font:14px/1.5 ui-monospace, monospace; }
  .item { border:1px solid var(--line); padding:14px; margin:14px 0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  input, select, textarea, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); padding:4px 6px; }
  textarea { width:100%; min-height:44px; } button { cursor:pointer; } button.primary { border-color:var(--accent); color:var(--accent); }
  .fact { border-left:3px solid var(--line); padding:4px 10px; margin:6px 0; }
  .span { color:var(--accent); } .err { color:var(--warn); } .muted { color:var(--muted); }
  nav { position:sticky; top:0; background:var(--bg); padding:8px 0; border-bottom:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }
</style>
<h1 id="title"></h1>
<p class="muted" id="intro"></p>
<nav>
  <label>Reviewer <input id="reviewer" placeholder="your name"></label>
  <button class="primary" id="export">Export JSONL</button>
  <span id="status" class="muted"></span>
</nav>
<div id="items"></div>
<script>
const DATA = /*__DATA__*/;
const TYPES = ['age','sex','gender','pronoun','race_ethnicity','medication','diagnosis','symptom','quantity','date','other'];
const SUBJECTS = ['patient','relative','other'];
const KEY = 'factuality-v3-' + DATA.mode + '-' + DATA.packet_hash;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} ; document.getElementById('status').textContent = 'saved ' + new Date().toLocaleTimeString(); };
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn); else n.setAttribute(k, v); } for (const k of kids) n.append(k); return n; };
const select = (opts, value, onchange) => { const s = el('select', {on: {change: e => onchange(e.target.value)}}); for (const o of opts) { const op = el('option', {value: o}, o); if (o === value) op.selected = true; s.append(op); } return s; };

function selectionIn(pre) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  const node = pre.firstChild;
  if (!node || r.startContainer !== node || r.endContainer !== node || r.collapsed) return null;
  return {start: r.startOffset, end: r.endOffset, text: node.data.slice(r.startOffset, r.endOffset)};
}
function spanButton(label, pre, onspan) {
  return el('button', {on: {click: () => { const s = selectionIn(pre); if (!s) { alert('Select text inside the ' + label + ' box first.'); return; } onspan(s); }}}, 'Use selection as ' + label + ' span');
}
const showSpans = spans => (spans || []).map(s => '“' + s.text + '” [' + s.start + '–' + s.end + ']').join('; ') || 'none';

document.getElementById('reviewer').value = state.reviewer || '';
document.getElementById('reviewer').addEventListener('input', e => { state.reviewer = e.target.value; save(); });

function planItem(item) {
  const st = state[item.case_id] = state[item.case_id] || {facts: [], frozen: false};
  const pre = el('pre', {}, item.dialogue);
  const box = el('div');
  const draw = () => {
    box.replaceChildren();
    st.facts.forEach((f, i) => {
      box.append(el('div', {class: 'fact'},
        el('div', {class: 'row'}, el('strong', {}, f.id), select(['pending', 'excluded'], f.label, v => { f.label = v; save(); }),
          select(TYPES, f.fact_type, v => { f.fact_type = v; save(); }), select(SUBJECTS, f.subject, v => { f.subject = v; save(); }),
          el('button', {on: {click: () => { st.facts.splice(i, 1); save(); draw(); }}}, 'remove')),
        el('textarea', {placeholder: 'Atomic expected fact', on: {input: e => { f.text = e.target.value; save(); }}}, f.text || ''),
        el('textarea', {placeholder: 'Rationale (why in or out of this section)', on: {input: e => { f.rationale = e.target.value; save(); }}}, f.rationale || ''),
        el('div', {class: 'row'}, spanButton('source', pre, s => { f.source_spans = [s]; f.visible_spans = [s]; save(); draw(); }),
          el('span', {class: 'span'}, showSpans(f.source_spans)))));
    });
  };
  draw();
  const frozen = el('input', {type: 'checkbox'}); frozen.checked = st.frozen;
  frozen.addEventListener('change', () => { st.frozen = frozen.checked; st.frozen_at = new Date().toISOString(); save(); });
  return el('div', {class: 'item'}, el('h2', {}, item.case_id + ' — ' + item.requested_section),
    el('h3', {}, 'Source dialogue'), pre,
    el('h3', {}, 'Expected facts for this section'), box,
    el('div', {class: 'row'}, el('button', {on: {click: () => { st.facts.push({id: 'f' + (st.facts.length + 1), label: 'pending', fact_type: 'other', subject: 'patient', visibility: 'visible', text: '', rationale: '', source_spans: [], visible_spans: []}); save(); draw(); }}}, 'Add fact'),
      el('label', {}, frozen, ' Plan complete and frozen; I have not seen any summary for this dialogue')));
}

function labelItem(item) {
  const st = state[item.item_id] = state[item.item_id] || {claims: [], facts: {}, claims_complete: false};
  const src = el('pre', {}, item.dialogue), vis = el('pre', {}, item.visible_input), pred = el('pre', {}, item.prediction);
  const claimsBox = el('div');
  const drawClaims = () => {
    claimsBox.replaceChildren();
    st.claims.forEach((c, i) => claimsBox.append(el('div', {class: 'fact'},
      el('div', {class: 'row'}, el('strong', {}, c.id), select(['supported', 'contradicted', 'unsupported', 'unclear'], c.label, v => { c.label = v; save(); }),
        select(TYPES, c.fact_type, v => { c.fact_type = v; save(); }), select(SUBJECTS, c.subject, v => { c.subject = v; save(); }),
        select(['visible', 'truncated', 'unclear'], c.visibility, v => { c.visibility = v; save(); }),
        el('button', {on: {click: () => { st.claims.splice(i, 1); save(); drawClaims(); }}}, 'remove')),
      el('textarea', {placeholder: 'Atomic claim', on: {input: e => { c.text = e.target.value; save(); }}}, c.text || ''),
      el('textarea', {placeholder: 'Rationale', on: {input: e => { c.rationale = e.target.value; save(); }}}, c.rationale || ''),
      el('div', {class: 'row'}, spanButton('summary', pred, s => { c.generated_span = s; save(); drawClaims(); }), el('span', {class: 'span'}, showSpans(c.generated_span ? [c.generated_span] : []))),
      el('div', {class: 'row'}, spanButton('source', src, s => { c.source_spans = (c.source_spans || []).concat([s]); save(); drawClaims(); }), el('span', {class: 'span'}, showSpans(c.source_spans))),
      el('div', {class: 'row'}, spanButton('visible', vis, s => { c.visible_spans = (c.visible_spans || []).concat([s]); save(); drawClaims(); }), el('span', {class: 'span'}, showSpans(c.visible_spans))),
      el('button', {on: {click: () => { c.source_spans = []; c.visible_spans = []; save(); drawClaims(); }}}, 'clear evidence'))));
  };
  drawClaims();
  const facts = el('div');
  for (const f of item.plan_facts) {
    const fs = st.facts[f.id] = st.facts[f.id] || {label: f.label === 'excluded' ? 'excluded' : 'pending', rationale: ''};
    const span = el('span', {class: 'span'}, showSpans(fs.generated_span ? [fs.generated_span] : []));
    facts.append(el('div', {class: 'fact'}, el('div', {}, f.id + ': ' + f.text + ' ', el('span', {class: 'muted'}, '(' + f.fact_type + '; source ' + showSpans(f.source_spans) + ')')),
      el('div', {class: 'row'}, f.label === 'excluded' ? el('span', {class: 'muted'}, 'excluded in plan') : select(['pending', 'present', 'omitted', 'unclear'], fs.label, v => { fs.label = v; save(); }),
        spanButton('summary', pred, s => { fs.generated_span = s; span.textContent = showSpans([s]); save(); }), span),
      el('textarea', {placeholder: 'Rationale', on: {input: e => { fs.rationale = e.target.value; save(); }}}, fs.rationale)));
  }
  const done = el('input', {type: 'checkbox'}); done.checked = st.claims_complete;
  done.addEventListener('change', () => { st.claims_complete = done.checked; save(); });
  return el('div', {class: 'item'}, el('h2', {}, item.item_id + ' — ' + item.requested_section + (item.truncated ? ' — input truncated' : '')),
    el('h3', {}, 'Summary'), pred, el('h3', {}, 'Source dialogue'), src, el('h3', {}, 'Model-visible input'), vis,
    el('h3', {}, 'Frozen expected facts'), facts, el('h3', {}, 'Atomic claims in the summary'), claimsBox,
    el('div', {class: 'row'}, el('button', {on: {click: () => { st.claims.push({id: 'c' + (st.claims.length + 1), label: 'supported', fact_type: 'other', subject: 'patient', visibility: 'visible', text: '', rationale: '', source_spans: [], visible_spans: []}); save(); drawClaims(); }}}, 'Add claim'),
      el('label', {}, done, ' All claims in this summary are recorded')));
}

function exportRows() {
  const reviewer = (state.reviewer || '').trim();
  if (!reviewer) { alert('Enter your name first.'); return; }
  let rows;
  if (DATA.mode === 'plan') {
    rows = DATA.items.map(item => { const st = state[item.case_id] || {facts: []};
      return Object.assign({}, item.plan, {expected_facts: st.facts, expected_facts_complete: !!st.frozen, expected_facts_frozen: !!st.frozen,
        expected_facts_blind: !!st.frozen, expected_facts_reviewer_kind: 'human', expected_facts_reviewer: reviewer, expected_facts_frozen_at: st.frozen ? st.frozen_at : null}); });
  } else {
    rows = DATA.items.filter(item => state[item.item_id]).map(item => { const st = state[item.item_id];
      const unresolved = st.claims_complete ? [] : ['Claim review incomplete.'];
      return {item_id: item.item_id, reviewer, status: 'partial', claims_complete: !!st.claims_complete, unresolved, claims: st.claims,
        expected_facts: item.plan_facts.map(f => Object.assign({id: f.id}, st.facts[f.id] || {label: 'pending', rationale: ''}))}; });
  }
  const blob = new Blob([rows.map(r => JSON.stringify(r)).join('\n') + '\n'], {type: 'application/jsonl'});
  const a = el('a', {href: URL.createObjectURL(blob), download: DATA.mode === 'plan' ? 'plans.jsonl' : 'labels.jsonl'}); a.click();
}
document.getElementById('export').addEventListener('click', exportRows);
document.getElementById('title').textContent = DATA.mode === 'plan' ? 'Source-only expected-fact plans' : 'Blinded summary review';
document.getElementById('intro').textContent = DATA.mode === 'plan'
  ? 'Write the facts each requested section should contain, from the dialogue alone (rules: docs/factuality_annotation_guide.md). Do not open any summary until every plan is frozen.'
  : 'Summaries are shown in a fixed shuffled order with no source model identified. Label every atomic claim and each frozen expected fact.';
const root = document.getElementById('items');
for (const item of DATA.items) root.append(DATA.mode === 'plan' ? planItem(item) : labelItem(item));
</script>
</html>
